function nextDate(days){let d=new Date();d.setDate(d.getDate()+days);return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};function exportReview(ep){let p=db.packs.writing[ep];let rows=p.items.filter(x=>db.answers[x.id]?.trim()).map(x=>`ID: ${x.id}\n한국어: ${x['한국어']}\n내 답안: ${db.answers[x.id]}\n기준 답안: ${x['기준 영어']}\n문법: ${x['문법']||''}`).join('\n\n---\n\n');if(!rows)return toast('먼저 영작 답안을 제출해줘');let content=`다음 영작을 첨삭해줘. 의미·시제·어순·관계사·자연스러움을 검토하고 허용 가능한 대안도 인정해줘. 마지막에는 아래 형식의 JSON 배열을 코드블록으로 출력해줘. 각 항목은 {"id":"원래 ID","verdict":"correct|revise","tags":["tense"],"correction":"교정 문장","explanation":"한국어 설명"} 형식이야.\n\n${rows}`;copy(content)};async function copy(s){try{await navigator.clipboard.writeText(s);toast('클립보드에 복사했어')}catch{prompt('아래 내용을 복사해줘',s)}};function review(){let due=Object.entries(db.vocabResults).filter(([id,r])=>r.next<=dateKey()||db.reviewFlags[id]);let flagged=Object.keys(db.reviewFlags).filter(id=>db.reviewFlags[id]&&!db.vocabResults[id]);return `<div class="eyebrow">SPACED REPETITION</div><h1>Review Desk.</h1><p class="sub">틀린 단어와 복습 예정 단어를 확인해. 영작 첨삭 결과도 이곳에서 가져올 수 있어.</p><div class="stats"><div class="stat"><strong>${new Set([...due.map(([id])=>id),...flagged]).size}</strong><small>오늘 단어 복습</small></div><div class="stat"><strong>${Object.keys(db.feedback).length}</strong><small>영작 첨삭 기록</small></div><div class="stat"><strong>${Object.keys(db.answers).length}</strong><small>저장된 영작</small></div></div><div class="sheet"><h3>ChatGPT 첨삭 결과 가져오기</h3><p class="sub">ChatGPT가 반환한 JSON 배열만 붙여넣어. ID가 일치하는 영작에 기록돼.</p><textarea class="textarea-small" id="feedbackinput" placeholder='[{"id":"writing:S1_EP01:W001","verdict":"revise","tags":["tense"],"correction":"...","explanation":"..."}]'></textarea><div class="actions"><button class="primary" onclick="importFeedback()">첨삭 결과 반영</button></div><div class="sub">현재 버전은 첨삭을 기록하고 오답을 표시해. 영작 자동 재출제는 추후 확장할 예정이야. 첨삭 결과는 해당 에피소드의 Writing Exercises에서 확인해.</div></div>${due.length||flagged.length?`<div class="sheet"><h3>복습 예정 단어</h3><p class="sub">복습할 단어를 눌러 다시 시험 볼 수 있어.</p>${[...new Set([...due.map(([id])=>id),...flagged])].map(id=>`<div class="vocabrow" style="grid-template-columns:1fr 100px"><button class="secondary" onclick="reviewWord('${id}')">${esc(id)}</button><span>재시험 →</span></div>`).join('')}</div>`:''}`};function records(){let dates=Object.entries(db.activity).sort((a,b)=>b[0].localeCompare(a[0]));let totalW=dates.reduce((s,[k,v])=>s+(v.writing||0),0),totalV=dates.reduce((s,[k,v])=>s+(v.vocab||0),0);return `<div class="eyebrow">STUDY RECORDS</div><h1>Learning Ledger.</h1><div class="stats"><div class="stat"><strong>${dates.length}</strong><small>학습한 날</small></div><div class="stat"><strong>${totalW}</strong><small>영작 제출 횟수</small></div><div class="stat"><strong>${totalV}</strong><small>단어 응시 횟수</small></div></div><div class="sheet"><h3>최근 학습 기록</h3>${dates.length?dates.slice(0,30).map(([d,v])=>`<div class="vocabrow" style="grid-template-columns:1fr 1fr 1fr"><span>${d}</span><span>영작 ${v.writing||0}</span><span>단어 ${v.vocab||0}</span></div>`).join(''):'<p class="sub">아직 학습 기록이 없어.</p>'}</div>`};function settings(){return `${cloudSettingsHTML()}<div class="eyebrow">PERSONAL ARCHIVE</div><h1>Settings & Files.</h1><p class="sub">학습팩 MD는 GitHub에 업로드하지 않고 기기에서 직접 불러와. 브라우저 저장 데이터가 지워지면 기록도 사라질 수 있으니 백업을 활용해.</p><div class="sheet"><h3>학습 기록 백업</h3><div class="actions"><button class="primary" onclick="backup()">JSON 백업 다운로드</button><button class="secondary" onclick="$('restorefile').click()">백업 복원</button><input class="hidden" type="file" id="restorefile" accept=".json" onchange="restore(event)"></div><p class="sub">로그인하면 클라우드 스냅샷 동기화를 사용해. 충돌 시 자동 병합하지 않으므로 백업을 권장해.</p></div><div class="sheet"><h3>MD 파일 형식</h3><p class="sub">에피소드 ID는 영작과 단어 파일에서 동일하게 작성해.</p><div class="note"># Episode\n- episode: S1_EP01\n- title: First Meeting\n\n## W001\n- 한국어: 어제 당신을 봤어요.\n- 기준 영어: I saw you yesterday.\n- 난이도: B1\n- 문법: 과거시제\n- 설명: see의 과거형은 saw.</div><div class="note"># Vocabulary\n- episode: S1_EP01\n- title: First Meeting\n\n## V001\n- 뜻: 망설이다\n- 정답: hesitate\n- 허용 정답: hesitate\n- 품사: 동사\n- 난이도: B1</div><p class="sub">현재 파서는 위처럼 정해진 한 줄 메타데이터 형식을 읽어. 다중 행 설명이나 복잡한 Markdown 표는 지원하지 않아.</p></div><div class="sheet"><h3>개인정보와 한계</h3><p class="sub">로컬 저장은 현재 브라우저의 localStorage를 사용하고, 로그인 시 Supabase에 학습 데이터 스냅샷을 저장해. AI 자동 첨삭과 영작 자동 재출제는 아직 구현되지 않았어. 단어 채점은 등록된 정답과 허용 정답의 철자 일치 방식이야. 공개된 GitHub Pages에서 사용하는 경우에도 불러온 MD 원본은 자동으로 GitHub에 올라가지 않아.</p></div>`};function backup(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='sawgin-study-backup-'+dateKey()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
function isVerb(x){return !!(x['기본형']||x['base']||x['과거형']||x['past']||x['과거분사']||x['participle'])}
function verbForms(x){return [x['기본형']||x['base']||x['정답'],x['과거형']||x['past']||'',x['과거분사']||x['participle']||'']}
function markReview(id,checked){db.reviewFlags[id]=checked;if(db.vocabResults[id]){db.vocabResults[id].next=checked?dateKey():db.vocabResults[id].next}save();toast(checked?'복습 목록에 표시했어':'수동 복습 표시를 해제했어')}
function reviewWord(id){for(let [ep,p] of Object.entries(db.packs.vocab)){let idx=p.items.findIndex(x=>x.id===id);if(idx>=0){view={page:'pack',mode:'vocab',ep,idx,quiz:true,reveal:false};render();scrollTo(0,0);return}}toast('원본 단어팩을 찾지 못했어')}
function award(key,points){if(db.xpAwards[key])return;db.xpAwards[key]=points;save()}

function levelInfo(){let xp=totalXP(),level=1,threshold=100;while(xp>=threshold&&level<100){level++;threshold+=level*100}let previous=threshold-level*100;return {xp,level,previous,threshold}}
function membership(){let a=levelInfo(),pct=Math.max(0,Math.min(100,100*(a.xp-a.previous)/(a.threshold-a.previous)));return `<section class="panel membership"><div class="panelhead"><h3>Library Membership.</h3><span class="pill">L${a.level} · ${a.level<3?'Reader':a.level<6?'Collector':'Archivist'}</span></div><div class="between"><span>${a.xp} XP</span><span>Next · ${a.threshold} XP</span></div><div class="bar"><div class="fill" style="width:${pct}%"></div></div><p class="sub">문제 첫 정답·제출과 에피소드 완료로 성장해. 복습은 언제든 가능해.</p></section>`}
