function nextDate(days){let d=new Date();d.setDate(d.getDate()+days);return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};function exportReview(ep){let p=db.packs.writing[ep];let rows=p.items.filter(x=>db.answers[x.id]?.trim()).map(x=>`ID: ${x.id}\n한국어: ${x['한국어']}\n내 답안: ${db.answers[x.id]}\n기준 답안: ${x['기준 영어']}\n문법: ${x['문법']||''}`).join('\n\n---\n\n');if(!rows)return toast('먼저 영작 답안을 제출해줘');let content=`다음 영작을 첨삭해줘. 의미·시제·어순·관계사·자연스러움을 검토하고 허용 가능한 대안도 인정해줘. 마지막에는 아래 형식의 JSON 배열을 코드블록으로 출력해줘. 각 항목은 {"id":"원래 ID","verdict":"correct|revise","tags":["tense"],"correction":"교정 문장","explanation":"한국어 설명"} 형식이야.\n\n${rows}`;copy(content)};async function copy(s){try{await navigator.clipboard.writeText(s);toast('클립보드에 복사했어')}catch{prompt('아래 내용을 복사해줘',s)}};function review(){let due=Object.entries(db.vocabResults).filter(([id,r])=>r.next<=dateKey()||db.reviewFlags[id]);let flagged=Object.keys(db.reviewFlags).filter(id=>db.reviewFlags[id]&&!db.vocabResults[id]);return `<div class="eyebrow">SPACED REPETITION</div><h1>Review Desk.</h1><p class="sub">틀린 단어와 복습 예정 단어를 확인해. 영작 첨삭 결과도 이곳에서 가져올 수 있어.</p><div class="stats"><div class="stat"><strong>${new Set([...due.map(([id])=>id),...flagged]).size}</strong><small>오늘 단어 복습</small></div><div class="stat"><strong>${Object.keys(db.feedback).length}</strong><small>영작 첨삭 기록</small></div><div class="stat"><strong>${Object.keys(db.answers).length}</strong><small>저장된 영작</small></div></div><div class="sheet"><h3>ChatGPT 첨삭 결과 가져오기</h3><p class="sub">ChatGPT가 반환한 JSON 배열만 붙여넣어. ID가 일치하는 영작에 기록돼.</p><textarea class="textarea-small" id="feedbackinput" placeholder='[{"id":"writing:S1_EP01:W001","verdict":"revise","tags":["tense"],"correction":"...","explanation":"..."}]'></textarea><div class="actions"><button class="primary" onclick="importFeedback()">첨삭 결과 반영</button></div><div class="sub">현재 버전은 첨삭을 기록하고 오답을 표시해. 영작 자동 재출제는 추후 확장할 예정이야. 첨삭 결과는 해당 에피소드의 Writing Exercises에서 확인해.</div></div>${due.length||flagged.length?`<div class="sheet"><h3>복습 예정 단어</h3><p class="sub">복습할 단어를 눌러 다시 시험 볼 수 있어.</p>${[...new Set([...due.map(([id])=>id),...flagged])].map(id=>`<div class="vocabrow" style="grid-template-columns:1fr 100px"><button class="secondary" onclick="reviewWord('${id}')">${esc(id)}</button><span>재시험 →</span></div>`).join('')}</div>`:''}`};function importFeedback(){try{let s=$('feedbackinput').value.trim().replace(/^```(?:json)?\s*/,'').replace(/\s*```$/,'');let data=JSON.parse(s);if(!Array.isArray(data))throw Error('JSON 배열이어야 해');let n=0;for(let item of data){if(!item.id||!['correct','revise'].includes(item.verdict))continue;if(!db.answers[item.id])continue;db.feedback[item.id]={verdict:item.verdict,tags:Array.isArray(item.tags)?item.tags:[],correction:item.correction||'',explanation:item.explanation||'',at:dateKey()};n++}save();toast(`${n}개 첨삭 결과 반영`);render()}catch(e){alert('첨삭 JSON 형식을 확인해줘: '+e.message)}};function records(){let dates=Object.entries(db.activity).sort((a,b)=>b[0].localeCompare(a[0]));let totalW=dates.reduce((s,[k,v])=>s+(v.writing||0),0),totalV=dates.reduce((s,[k,v])=>s+(v.vocab||0),0);return `<div class="eyebrow">STUDY RECORDS</div><h1>Learning Ledger.</h1><div class="stats"><div class="stat"><strong>${dates.length}</strong><small>학습한 날</small></div><div class="stat"><strong>${totalW}</strong><small>영작 제출 횟수</small></div><div class="stat"><strong>${totalV}</strong><small>단어 응시 횟수</small></div></div><div class="sheet"><h3>최근 학습 기록</h3>${dates.length?dates.slice(0,30).map(([d,v])=>`<div class="vocabrow" style="grid-template-columns:1fr 1fr 1fr"><span>${d}</span><span>영작 ${v.writing||0}</span><span>단어 ${v.vocab||0}</span></div>`).join(''):'<p class="sub">아직 학습 기록이 없어.</p>'}</div>`};function settings(){return `${cloudSettingsHTML()}<div class="eyebrow">PERSONAL ARCHIVE</div><h1>Settings & Files.</h1><p class="sub">학습팩 MD는 GitHub에 업로드하지 않고 기기에서 직접 불러와. 브라우저 저장 데이터가 지워지면 기록도 사라질 수 있으니 백업을 활용해.</p><div class="sheet"><h3>학습 기록 백업</h3><div class="actions"><button class="primary" onclick="backup()">JSON 백업 다운로드</button><button class="secondary" onclick="$('restorefile').click()">백업 복원</button><input class="hidden" type="file" id="restorefile" accept=".json" onchange="restore(event)"></div><p class="sub">로그인하면 클라우드 스냅샷 동기화를 사용해. 충돌 시 자동 병합하지 않으므로 백업을 권장해.</p></div><div class="sheet"><h3>MD 파일 형식</h3><p class="sub">에피소드 ID는 영작과 단어 파일에서 동일하게 작성해.</p><div class="note"># Episode\n- episode: S1_EP01\n- title: First Meeting\n\n## W001\n- 한국어: 어제 당신을 봤어요.\n- 기준 영어: I saw you yesterday.\n- 난이도: B1\n- 문법: 과거시제\n- 설명: see의 과거형은 saw.</div><div class="note"># Vocabulary\n- episode: S1_EP01\n- title: First Meeting\n\n## V001\n- 뜻: 망설이다\n- 정답: hesitate\n- 허용 정답: hesitate\n- 품사: 동사\n- 난이도: B1</div><p class="sub">현재 파서는 위처럼 정해진 한 줄 메타데이터 형식을 읽어. 다중 행 설명이나 복잡한 Markdown 표는 지원하지 않아.</p></div><div class="sheet"><h3>개인정보와 한계</h3><p class="sub">로컬 저장은 현재 브라우저의 localStorage를 사용하고, 로그인 시 Supabase에 학습 데이터 스냅샷을 저장해. AI 자동 첨삭과 영작 자동 재출제는 아직 구현되지 않았어. 단어 채점은 등록된 정답과 허용 정답의 철자 일치 방식이야. 공개된 GitHub Pages에서 사용하는 경우에도 불러온 MD 원본은 자동으로 GitHub에 올라가지 않아.</p></div>`};function backup(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='sawgin-study-backup-'+dateKey()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};async function restore(ev){let f=ev.target.files?.[0];if(!f)return;try{let v=JSON.parse(await f.text());if(!v.packs||!v.answers||!v.activity)throw Error('백업 형식이 달라');if(!confirm('현재 학습 기록을 백업 파일로 교체할까?'))return;db=v;save();render();toast('백업을 복원했어')}catch(e){alert('복원 실패: '+e.message)}};function setSort(v){db.settings['sort_'+view.mode]=v;save();render()}
function isVerb(x){return !!(x['기본형']||x['base']||x['과거형']||x['past']||x['과거분사']||x['participle'])}
function verbForms(x){return [x['기본형']||x['base']||x['정답'],x['과거형']||x['past']||'',x['과거분사']||x['participle']||'']}
function markReview(id,checked){db.reviewFlags[id]=checked;if(db.vocabResults[id]){db.vocabResults[id].next=checked?dateKey():db.vocabResults[id].next}save();toast(checked?'복습 목록에 표시했어':'수동 복습 표시를 해제했어')}
function reviewWord(id){for(let [ep,p] of Object.entries(db.packs.vocab)){let idx=p.items.findIndex(x=>x.id===id);if(idx>=0){view={page:'pack',mode:'vocab',ep,idx,quiz:true,reveal:false};render();scrollTo(0,0);return}}toast('원본 단어팩을 찾지 못했어')}
function award(key,points){if(db.xpAwards[key])return;db.xpAwards[key]=points;save()}
function totalXP(){let xp=Object.values(db.xpAwards).reduce((a,b)=>a+Number(b||0),0);for(let [mode,packs] of Object.entries(db.packs))for(let [ep,p] of Object.entries(packs)){let [done,total]=count(mode,ep);if(total&&done===total)xp+=50}return xp}
function levelInfo(){let xp=totalXP(),level=1,threshold=100;while(xp>=threshold&&level<100){level++;threshold+=level*100}let previous=threshold-level*100;return {xp,level,previous,threshold}}
function membership(){let a=levelInfo(),pct=Math.max(0,Math.min(100,100*(a.xp-a.previous)/(a.threshold-a.previous)));return `<section class="panel membership"><div class="panelhead"><h3>Library Membership.</h3><span class="pill">L${a.level} · ${a.level<3?'Reader':a.level<6?'Collector':'Archivist'}</span></div><div class="between"><span>${a.xp} XP</span><span>Next · ${a.threshold} XP</span></div><div class="bar"><div class="fill" style="width:${pct}%"></div></div><p class="sub">문제 첫 정답·제출과 에피소드 완료로 성장해. 복습은 언제든 가능해.</p></section>`}
function achievementPanel(){let checks=[{key:'first-writing',title:'First Page',ok:Object.keys(db.answers).length>=1},{key:'first-vocab',title:'First Word',ok:Object.values(db.vocabResults).some(r=>r.attempts>0)},{key:'five-words',title:'Word Collector',ok:Object.values(db.vocabResults).filter(r=>r.correct).length>=5},{key:'first-feedback',title:'The Editor',ok:Object.keys(db.feedback).length>=1},{key:'first-episode',title:'Archivist',ok:Object.entries(db.packs).some(([mode,packs])=>Object.keys(packs).some(ep=>{let [d,t]=count(mode,ep);return t&&d===t}))}];return `<section class="panel achievements"><div class="panelhead"><h3>Achievement Cabinet.</h3><span class="eyebrow">${checks.filter(x=>x.ok).length} / ${checks.length} UNLOCKED</span></div><div class="badge-grid">${checks.map(x=>`<div class="achievement ${x.ok?'unlocked':'locked'}"><span class="stamp">${x.ok?'✦':'◇'}</span><b>${x.title}</b><small>${x.ok?'STAMPED':'LOCKED'}</small></div>`).join('')}</div></section>`}
function render(){let app=$('app');app.innerHTML=({home,library,pack,review,records,settings}[view.page]||home)();document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===view.page))};document.querySelectorAll('[data-nav]').forEach(b=>b.addEventListener('click',()=>navigate(b.dataset.nav)));
function cloudStatus(message){let el=document.getElementById('cloudIndicator');if(el)el.textContent='CLOUD · '+message}
function cloudQueue(){if(!cloudReady||!cloudUser)return;cloudDirty=true;clearTimeout(cloudTimer);cloudTimer=setTimeout(cloudPush,1100);cloudStatus('저장 대기 중')}
async function cloudPush(){if(!cloudReady||!cloudUser||!cloudDirty||cloudBusy)return;cloudBusy=true;cloudDirty=false;cloudStatus('동기화 중');try{let timestamp=new Date().toISOString();let {error}=await cloudClient.from('lab_profiles').upsert({user_id:cloudUser.id,preferences:{cloud_state:db,cloud_updated_at:timestamp},updated_at:timestamp},{onConflict:'user_id'});if(error)throw error;cloudUpdatedAt=timestamp;cloudStatus('동기화 완료')}catch(e){cloudDirty=true;cloudStatus('동기화 실패 · Settings에서 재시도');console.error('Cloud sync:',e.message)}finally{cloudBusy=false;if(cloudDirty)cloudQueue()}}
function cloudSettingsHTML(){return `<div class="sheet"><h3>Cloud Sync · PC / iPhone</h3><p class="sub">${cloudUser?'로그인됨: '+esc(cloudUser.email||''):'로그인이 필요해. 최초 한 번 인증하면 다음 방문부터 로그인 상태를 유지해.'}</p><p class="sub">클라우드에는 학습 데이터 전체 스냅샷을 보관해. 여러 기기에서 동시에 편집하지 말고, 기기 변경 전 동기화 완료를 확인해.</p><div class="actions">${cloudUser?'<button class="secondary" onclick="cloudPushManual()">지금 동기화</button><button class="secondary" onclick="cloudPullManual()">서버 기록 다시 불러오기</button><button class="secondary" onclick="cloudSignOut()">로그아웃</button>':'<button class="primary" onclick="cloudShowLogin()">로그인 / 가입</button>'}</div></div>`}
function cloudModal(html){document.getElementById('cloudDialog').innerHTML=html;document.getElementById('cloudOverlay').style.display='flex'}
function cloudClose(){document.getElementById('cloudOverlay').style.display='none'}
function cloudShowLogin(){cloudModal(`<div class="eyebrow">SAW & GIN / CLOUD ACCESS</div><h2>Library Sign-in.</h2><p>PC와 아이폰에서 같은 이메일 계정을 사용해. 첫 로그인 후에는 상태가 유지돼.</p><label>이메일</label><input id="cloudEmail" type="email" autocomplete="email" placeholder="you@example.com"><label>비밀번호 (8자 이상)</label><input id="cloudPassword" type="password" autocomplete="current-password"><div class="actions"><button class="primary" onclick="cloudPasswordAuth(false)">로그인</button><button class="secondary" onclick="cloudPasswordAuth(true)">처음 가입</button><button class="secondary" onclick="cloudEmailOtp()">이메일 코드 받기</button></div><p id="cloudAuthMessage" role="status"></p><button class="secondary" onclick="cloudClose()">닫기 · 로컬 모드로 계속</button>`)}
function cloudAuthMessage(s){let el=document.getElementById('cloudAuthMessage');if(el)el.textContent=s}
async function cloudPasswordAuth(signup){if(!cloudClient)return cloudAuthMessage('로그인 라이브러리를 불러오지 못했어. 인터넷 연결을 확인해.');let email=document.getElementById('cloudEmail').value.trim(),password=document.getElementById('cloudPassword').value;if(!email||password.length<8)return cloudAuthMessage('이메일과 8자 이상의 비밀번호를 입력해.');let {data,error}=signup?await cloudClient.auth.signUp({email,password}):await cloudClient.auth.signInWithPassword({email,password});if(error)return cloudAuthMessage(error.message);if(data.session){cloudClose();await cloudOnLogin(data.user)}else cloudAuthMessage('가입 확인 이메일이 발송됐어. 메일 인증 후 로그인해.')}
async function cloudEmailOtp(){let email=document.getElementById('cloudEmail').value.trim();if(!email)return cloudAuthMessage('이메일을 입력해.');let {error}=await cloudClient.auth.signInWithOtp({email,options:{shouldCreateUser:false}});if(error)return cloudAuthMessage(error.message);cloudModal(`<h2>Email Verification.</h2><p>${esc(email)}로 전송된 8자리 코드를 입력해.</p><input id="cloudOtp" inputmode="numeric" autocomplete="one-time-code" maxlength="8" placeholder="인증 코드"><button class="primary" onclick="cloudVerifyOtp('${esc(email)}')">인증하기</button><p id="cloudAuthMessage"></p><button class="secondary" onclick="cloudShowLogin()">돌아가기</button>`)}
async function cloudVerifyOtp(email){let token=document.getElementById('cloudOtp').value.trim();let {data,error}=await cloudClient.auth.verifyOtp({email,token,type:'email'});if(error)return cloudAuthMessage(error.message);cloudClose();await cloudOnLogin(data.user)}
function hasLocalStudy(){return Object.keys(db.answers||{}).length>0||Object.keys(db.vocabResults||{}).length>0||Object.keys(db.packs?.writing||{}).length>0||Object.keys(db.packs?.vocab||{}).length>0}
async function cloudOnLogin(user){if(!user)return;cloudUser=user;cloudReady=false;cloudStatus('서버 기록 확인 중');let {data,error}=await cloudClient.from('lab_profiles').select('preferences,updated_at').eq('user_id',user.id).maybeSingle();if(error){cloudStatus('접속 오류 · '+error.message);return}let remote=data?.preferences?.cloud_state;if(remote&&remote.packs&&remote.answers){if(hasLocalStudy()){cloudModal(`<h2>Choose Your Library.</h2><p>이 기기와 서버에 각각 학습 기록이 있어. 덮어쓰기를 방지하려고 자동 병합하지 않았어.</p><p>먼저 Settings에서 JSON 백업을 내려받는 걸 추천해.</p><button class="primary" onclick="cloudChoose('remote')">서버 기록 사용</button><button class="secondary" onclick="cloudChoose('local')">이 기기 기록을 서버에 저장</button><button class="secondary" onclick="cloudChoose('later')">나중에 결정</button>`);window.pendingCloudState=remote;return}db=remote;localStorage.setItem(KEY,JSON.stringify(db));cloudUpdatedAt=data.preferences.cloud_updated_at;render()}cloudReady=true;cloudStatus(remote?'동기화 완료':'첫 업로드 준비');if(!remote)cloudQueue();render()}
function cloudChoose(choice){cloudClose();if(choice==='later'){cloudStatus('동기화 보류');return}if(choice==='remote'){db=window.pendingCloudState;localStorage.setItem(KEY,JSON.stringify(db));cloudReady=true;cloudStatus('서버 기록 불러옴');render()}else{cloudReady=true;cloudQueue();render()}window.pendingCloudState=null}
async function cloudPushManual(){cloudDirty=true;await cloudPush();render()}
async function cloudPullManual(){if(!confirm('이 기기 기록을 서버 기록으로 교체할까? 먼저 JSON 백업을 권장해.'))return;cloudReady=false;await cloudOnLogin(cloudUser)}
async function cloudSignOut(){if(!confirm('로그아웃할까? 이 기기의 로컬 기록은 남아 있어.'))return;cloudReady=false;cloudUser=null;await cloudClient.auth.signOut();cloudStatus('로그아웃됨');render()}
async function cloudInit(){if(!window.supabase){cloudStatus('라이브러리 로딩 실패 · 오프라인 모드');return}cloudClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLIC_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});let {data,error}=await cloudClient.auth.getSession();if(error){cloudStatus('로그인 확인 실패');return}if(data.session?.user)await cloudOnLogin(data.session.user);else{cloudStatus('로컬 모드 · 로그인 필요');cloudShowLogin()}cloudClient.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_OUT'){cloudUser=null;cloudReady=false;cloudStatus('로그아웃됨')}})}


</script><script>window.v04={review,settings,records,exportReview,parseMD,backup};</script><script src="./script-packs.js"></script><script src="./lab-v05r.js"></script></body></html>
