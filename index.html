<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4f0e8"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" type="image/png" href="icon-192.png"><link rel="apple-touch-icon" href="icon-180.png"><title>Saw & Gin English Lab</title><style>
:root{--paper:#f4f0e8;--cream:#f5efc6;--wine:#4d0e12;--blue:#a5bcd6;--soil:#4a2e27;--ink:#231815;--line:#c9beaf}*{box-sizing:border-box}body{margin:0;background:#e8e2d8;color:var(--ink);font-family:Georgia,'Noto Serif KR',serif}button,input,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #5a85b3;outline-offset:2px}.shell{max-width:980px;margin:auto;min-height:100vh;background:var(--paper);padding:24px clamp(16px,4vw,44px) 90px}.top{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:24px}.eyebrow{font:11px Arial,sans-serif;letter-spacing:.18em;text-transform:uppercase;color:#78695b}.logo{font-size:15px;letter-spacing:.04em;font-weight:bold}.nav{display:flex;gap:8px;flex-wrap:wrap}.nav button,.smallbtn{background:transparent;border:1px solid #bcb0a2;padding:9px 12px;color:var(--soil);border-radius:4px;font:12px Arial,sans-serif}.nav button.active{background:var(--soil);color:#fff}h1{font-size:clamp(32px,5vw,56px);font-weight:normal;line-height:1.1;margin:8px 0 12px}h2{font-size:27px;font-weight:normal;margin:0 0 18px}h3{font-size:20px;font-weight:normal;margin:0}.sub{color:#75685d;font-size:14px;line-height:1.7}.books{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin:26px 0}.book{border:0;text-align:left;min-height:270px;position:relative;padding:26px;color:var(--cream);background:var(--wine);box-shadow:6px 8px 0 #d1c4b5,inset 9px 0 0 #ffffff20;display:flex;flex-direction:column;justify-content:space-between;transition:transform .2s}.book:hover{transform:translateY(-4px)}.book.blue{background:var(--blue);color:var(--ink);box-shadow:6px 8px 0 #c4b9ad,inset 9px 0 0 #ffffff55}.book strong{font-size:clamp(26px,4vw,42px);font-weight:normal}.book .line{border-top:1px solid currentColor;opacity:.5;margin:14px 0}.book small{font:11px Arial,sans-serif;letter-spacing:.12em}.panels{display:grid;grid-template-columns:1fr 1fr;gap:18px}.panel{padding:22px;background:#fbf8f1;border:1px solid #e1d9cd}.panel.yellow{background:var(--cream)}.panelhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;gap:12px}.week{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;text-align:center}.day{padding:10px 0;background:#e8dfc7;font:12px Arial,sans-serif}.day.done{background:var(--soil);color:#fff}.day.today{outline:2px solid var(--wine);outline-offset:2px}.weeklabel{font:10px Arial,sans-serif;color:#796a5b}.progressrow{margin:15px 0}.progressrow .between{display:flex;justify-content:space-between;gap:10px;font:12px Arial,sans-serif}.bar{height:10px;background:#e5ded2;margin-top:9px;border-radius:20px;overflow:hidden}.fill{height:100%;background:var(--wine)}.fill.blue{background:#7d9dbd}.folderlist{margin:25px 0}.folder{width:100%;text-align:left;border:1px solid #0002;padding:18px 20px 25px;margin-top:-3px;border-radius:12px 12px 3px 3px;min-height:96px;box-shadow:0 5px 0 #00000009}.folder:hover{filter:brightness(.96)}.folder .tab{display:inline-block;padding:6px 14px 6px 0;font:12px Arial,sans-serif;letter-spacing:.09em}.folder .between{display:flex;justify-content:space-between;align-items:center;gap:12px}.folder strong{font-size:21px;font-weight:normal}.folder small{font:11px Arial,sans-serif}.actions{display:flex;gap:9px;flex-wrap:wrap;margin:20px 0}.primary{border:0;background:var(--wine);color:var(--cream);padding:13px 19px;border-radius:3px;font:13px Arial,sans-serif}.secondary{border:1px solid var(--soil);background:transparent;color:var(--soil);padding:12px 16px;border-radius:3px;font:13px Arial,sans-serif}.sheet{background:#fbf8f1;border:1px solid #d7cbbd;padding:clamp(18px,4vw,38px);margin-top:18px;box-shadow:5px 6px 0 #d9d0c4}.sheethead{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:14px;gap:10px}.question{font-size:clamp(22px,3vw,31px);line-height:1.55;margin:25px 0}.answer{display:block;width:100%;border:1px solid #cfc5b8;border-radius:3px;background:#fff;padding:15px;color:var(--ink);min-height:130px;resize:vertical;line-height:1.6}.answer.short{min-height:unset}.note{background:#ede9df;padding:16px;line-height:1.6;margin-top:15px;font-size:14px;white-space:pre-wrap}.vocabrow{display:grid;grid-template-columns:42px 1fr 1fr 82px;gap:10px;padding:14px 4px;border-bottom:1px solid var(--line);align-items:center;font-size:14px}.vocabrow.head{font:10px Arial,sans-serif;letter-spacing:.08em;color:#746456}.vocabrow .status{font:10px Arial,sans-serif;color:#785c55;text-align:right}.muted{color:#74685e}.hidden{display:none!important}.error{color:#9b2d34}.success{color:#315b42}.pill{display:inline-block;padding:5px 8px;border:1px solid #bdb3a5;font:10px Arial,sans-serif;letter-spacing:.07em}.empty{padding:32px;text-align:center;border:1px dashed #b6aa9d;color:#73665a}.textarea-small{width:100%;min-height:125px;padding:12px;background:#fff;border:1px solid var(--line)}.footer{margin-top:45px;border-top:1px solid var(--line);padding-top:15px;font:11px Arial,sans-serif;color:#817469}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{background:#efe8db;padding:16px}.stat strong{display:block;font-size:25px;font-weight:normal}.stat small{font:11px Arial,sans-serif}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;z-index:9;max-width:90vw;font:13px Arial,sans-serif}@media(max-width:680px){.shell{padding:16px 16px 90px}.top{align-items:flex-start;gap:12px;flex-direction:column}.books{gap:12px}.book{min-height:220px;padding:17px}.panels{grid-template-columns:1fr}.panel{padding:18px}.vocabrow{grid-template-columns:25px 1fr 1fr 60px;font-size:12px;gap:5px}.sheethead{font-size:11px}.stats{gap:6px}.stat{padding:10px}}
.cal-nav{display:flex;align-items:center;gap:6px}.cal-nav button{background:transparent;border:1px solid #c9beaf;border-radius:3px;padding:5px 8px;color:var(--soil);font:12px Arial,sans-serif}.writing-entry{border-bottom:1px solid var(--line)}.writing-row{display:grid;grid-template-columns:35px minmax(0,1fr) 105px 20px;align-items:center;gap:8px;width:100%;padding:18px 4px;border:0;background:transparent;text-align:left;color:var(--ink);font-size:14px}.writing-row:hover{background:#eee7db}.writing-row .status{text-align:right;font:11px Arial,sans-serif;color:#916455}.writing-row .status.correct{color:#426e58}.writing-row .status.revise{color:#a24d42}.writing-row .arrow{text-align:right;color:#8b7868}.writing-detail{background:#f0e9df;padding:18px 22px;margin:0 0 12px 35px;font-size:14px;line-height:1.65}.writing-detail p{margin:8px 0 14px;white-space:pre-wrap}.feedback-note{background:#fbf8f1;border-left:3px solid var(--wine);padding:15px;margin-top:12px;line-height:1.6;white-space:pre-wrap}.feedback-note p{margin:8px 0}.tagline{display:flex;gap:5px;flex-wrap:wrap}@media(max-width:520px){.writing-row{grid-template-columns:26px minmax(0,1fr) 76px 12px;gap:5px}.writing-row .status{font-size:9px}.writing-detail{margin-left:0;padding:14px}.cal-nav{gap:3px}.cal-nav button{padding:4px 6px}}

select{padding:11px 12px;background:#fbf8f1;border:1px solid var(--line);color:var(--ink);border-radius:3px;font:12px Arial,sans-serif}.membership,.achievements{margin-top:20px}.membership .between{display:flex;justify-content:space-between;font:12px Arial,sans-serif}.badge-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:9px}.achievement{border:1px solid #d7cabb;background:#eee9df;padding:13px 6px;display:flex;align-items:center;justify-content:center;flex-direction:column;min-height:115px;text-align:center;gap:6px}.achievement.unlocked{background:var(--cream);border-color:#b4a382}.achievement.locked{opacity:.6}.achievement b{font-size:12px}.achievement small{font:9px Arial,sans-serif;letter-spacing:.08em}.stamp{font-size:28px;color:var(--wine)}.verbfields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.verbfields label{font:11px Arial,sans-serif;letter-spacing:.05em;color:var(--soil)}.verbfields input{margin-top:8px;width:100%}.review-toggle{display:flex;align-items:center;gap:9px;padding:12px 0;font:14px Arial,sans-serif}.review-mini{display:block;font:11px Arial,sans-serif;color:var(--soil);margin-top:8px}@media(max-width:680px){.badge-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.verbfields{grid-template-columns:1fr}}
</style></head><body><div class="shell"><header class="top"><div class="logo">S&G <span class="eyebrow">/ English Lab</span></div><nav class="nav"><button data-nav="home">HOME</button><button data-nav="review">REVIEW</button><button data-nav="records">RECORDS</button><button data-nav="settings">SETTINGS</button></nav></header><main id="app"></main><footer class="footer">SAW & GIN ENGLISH LAB · PERSONAL STUDY ARCHIVE · PROTOTYPE 0.3</footer></div><div id="toast" class="toast hidden"></div><script>
const KEY='sawgin-lab-v01';let db={packs:{writing:{},vocab:{}},answers:{},vocabResults:{},activity:{},feedback:{},colors:{}};try{const saved=JSON.parse(localStorage.getItem(KEY));if(saved)db={...db,...saved,packs:{writing:{},vocab:{},...saved.packs}}}catch{};db.settings??={};db.reviewFlags??={};db.xpAwards??={};db.achievements??={};let calendarOffset=0;let expandedWriting=null;let view={page:'home',mode:'writing',ep:null,idx:0,quiz:false,reveal:false};const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch{toast('저장 공간이 부족해. 백업을 내보내줘.')}};function toast(s){$('toast').textContent=s;$('toast').classList.remove('hidden');setTimeout(()=>$('toast').classList.add('hidden'),2500)};function dateKey(){let d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};function activity(type){let k=dateKey();db.activity[k]??={writing:0,vocab:0};db.activity[k][type]++;save()};function navigate(page,mode,ep){view={page,mode:mode||view.mode,ep:ep||null,idx:0,quiz:false,reveal:false};render();scrollTo(0,0)};function header(title,sub=''){return `<div class="eyebrow">THE LEARNING LIBRARY / ${esc(view.mode.toUpperCase())}</div><h1>${esc(title)}</h1><div class="sub">${esc(sub)}</div>`};function count(mode,ep){let p=db.packs[mode][ep];if(!p)return [0,0];let ids=p.items.map(x=>x.id);let done=ids.filter(id=>mode==='writing'?db.answers[id]?.trim():db.vocabResults[id]?.attempts>0).length;return [done,ids.length]};function progress(mode){let eps=Object.keys(db.packs[mode]);if(!eps.length)return `<div class="muted">아직 불러온 ${mode==='writing'?'영작':'단어'} 학습팩이 없어.</div>`;return eps.sort((a,b)=>(db.packs[mode][b].updatedAt||0)-(db.packs[mode][a].updatedAt||0)||b.localeCompare(a)).slice(0,1).map(ep=>{let [d,t]=count(mode,ep);return `<div class="progressrow"><div class="between"><span>${mode==='writing'?'Writing':'Vocabulary'} · ${esc(ep)}</span><span>${d} / ${t} · ${t?Math.round(d/t*100):0}%</span></div><div class="bar"><div class="fill ${mode==='vocab'?'blue':''}" style="width:${t?d/t*100:0}%"></div></div></div>`}).join('')};function calendar(){let now=new Date(),shown=new Date(now.getFullYear(),now.getMonth()+calendarOffset,1),y=shown.getFullYear(),m=shown.getMonth(),first=(new Date(y,m,1).getDay()+6)%7,days=new Date(y,m+1,0).getDate();let cells='';for(let i=0;i<first;i++)cells+='<span></span>';for(let d=1;d<=days;d++){let key=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`,a=db.activity[key],done=a&&(a.writing+a.vocab)>0;cells+=`<div class="day ${done?'done':''} ${calendarOffset===0&&d===now.getDate()?'today':''}" title="${esc(key)} · 영작 ${a?.writing||0}, 단어 ${a?.vocab||0}">${d}</div>`}return `<div class="week">${['M','T','W','T','F','S','S'].map(d=>`<span class="weeklabel">${d}</span>`).join('')}${cells}</div>`};function changeMonth(n){calendarOffset+=n;render()};function home(){return `<div class="eyebrow">PERSONAL LANGUAGE ARCHIVE</div><h1>My Learning Library.</h1><div class="sub">Choose a volume to begin your practice.</div><div class="books"><button class="book blue" onclick="navigate('library','vocab')"><div><small>VOLUME I / STEP 01</small><div class="line"></div><strong>Vocabulary</strong><p>단어 연습</p></div><small>▤ &nbsp; OPEN BOOK →</small></button><button class="book" onclick="navigate('library','writing')"><div><small>VOLUME II / STEP 02</small><div class="line"></div><strong>Writing</strong><p>영작 연습</p></div><small>✎ &nbsp; OPEN BOOK →</small></button></div><div class="panels"><section class="panel yellow"><div class="panelhead"><h3>Study Calendar.</h3><span class="eyebrow"><span class="cal-nav"><button aria-label="이전 달" onclick="changeMonth(-1)">‹</button><span>${new Date(new Date().getFullYear(),new Date().getMonth()+calendarOffset,1).toLocaleDateString('en-US',{month:'short',year:'numeric'})}</span><button aria-label="다음 달" onclick="changeMonth(1)">›</button><button aria-label="이번 달" onclick="calendarOffset=0;render()">Today</button></span></div>${calendar()}<p class="sub" style="font-size:12px">답안을 제출하면 해당 날짜에 자동 표시돼.</p></section><section class="panel"><div class="panelhead"><h3>Learning Progress.</h3><span class="eyebrow">CURRENT PACK</span></div>${progress('vocab')}${progress('writing')}<p class="sub" style="font-size:12px">게이지는 정답률이 아닌 첫 제출 완료율이야.</p></section></div>${membership()}${achievementPanel()}`};const palette=['#f5efc6','#a5bcd6','#4d0e12','#4a2e27','#231815'];function color(ep){if(db.colors[ep]===undefined){let hash=[...ep].reduce((a,c)=>a*31+c.charCodeAt(0),7);db.colors[ep]=Math.abs(hash)%5;save()}return palette[db.colors[ep]]};function library(){let mode=view.mode,sort=db.settings['sort_'+mode]||'recent',eps=Object.keys(db.packs[mode]).sort((a,b)=>sort==='episode-asc'?a.localeCompare(b,undefined,{numeric:true}):sort==='episode-desc'?b.localeCompare(a,undefined,{numeric:true}):sort==='oldest'?(db.packs[mode][a].updatedAt||0)-(db.packs[mode][b].updatedAt||0): (db.packs[mode][b].updatedAt||0)-(db.packs[mode][a].updatedAt||0)||b.localeCompare(a));return `${header(mode==='writing'?'Writing Archive.':'Vocabulary Archive.','에피소드 폴더를 선택해 문제집을 열어봐.')}<div class="actions"><button class="primary" onclick="$('filepick').click()">+ ${mode==='writing'?'영작':'단어'} MD 불러오기</button><button class="secondary" onclick="navigate('home')">← 서재로</button><label class="eyebrow" for="sortpacks">정렬</label><select id="sortpacks" onchange="setSort(this.value)"><option value="recent" ${sort==='recent'?'selected':''}>최근 추가순</option><option value="oldest" ${sort==='oldest'?'selected':''}>먼저 추가순</option><option value="episode-asc" ${sort==='episode-asc'?'selected':''}>EP 번호순 ↑</option><option value="episode-desc" ${sort==='episode-desc'?'selected':''}>EP 번호순 ↓</option></select><input id="filepick" class="hidden" type="file" accept=".md,.txt,text/markdown,text/plain" onchange="loadFile(event)"></div>${eps.length?`<div class="folderlist">${eps.map(ep=>{let p=db.packs[mode][ep],c=color(ep),light=['#4d0e12','#4a2e27','#231815'].includes(c),[d,t]=count(mode,ep);return `<button class="folder" style="background:${c};color:${light?'#f5efc6':'#231815'}" onclick="navigate('pack','${mode}','${esc(ep)}')"><div class="tab">${esc(ep)}</div><div class="between"><strong>${esc(p.title||ep)}</strong><small>${d} / ${t} · ${d===t&&t?'CLEARED':'IN PROGRESS'}</small></div></button>`}).join('')}</div>`:'<div class="empty">아직 폴더가 없어. MD 파일을 추가해봐.<br><br>설정에서 샘플 MD 형식을 확인할 수 있어.</div>'}`};function parseMD(raw,mode){let meta={},items=[],current=null;for(let line of raw.split(/\r?\n/)){let h=line.match(/^##\s+(.+)$/);if(h){if(current)items.push(current);current={id:h[1].trim()};continue}let m=line.match(/^\s*-\s*([^:：]+)\s*[:：]\s*(.*)$/);if(m){let k=m[1].trim(),v=m[2].trim();(current||meta)[k]=v}}if(current)items.push(current);let ep=meta.episode||meta.에피소드;if(!ep)throw Error('상단에 - episode: S1_EP01 항목이 필요해.');let fields=mode==='writing'?['한국어','기준 영어']:['뜻','정답'];for(let it of items){if(!it.id||fields.some(f=>!it[f]))throw Error(`문제 ${it.id||'(ID 없음)'}: ${fields.join(', ')} 항목이 필요해.`);it.id=`${mode}:${ep}:${it.id}`};if(!items.length)throw Error('## 문제 ID 형식으로 작성된 문제가 없어.');return {ep,title:meta.title||meta.제목||ep,items}};async function loadFile(ev){let file=ev.target.files?.[0];if(!file)return;try{let parsed=parseMD(await file.text(),view.mode);let exists=!!db.packs[view.mode][parsed.ep];if(exists&&!confirm(`${parsed.ep}가 이미 있어. 문제 데이터를 업데이트할까? 기존 ID의 답안 기록은 유지돼.`))return;db.packs[view.mode][parsed.ep]={title:parsed.title,items:parsed.items,updatedAt:Date.now()};save();toast(`${parsed.ep} · ${parsed.items.length}문제 불러왔어`);render()}catch(e){alert('MD 불러오기 오류: '+e.message)}};function pack(){let p=db.packs[view.mode][view.ep];if(!p)return navigate('library',view.mode);let [d,t]=count(view.mode,view.ep);return `${header(p.title,`${view.ep} · ${view.mode==='writing'?'영작 문제집':'단어 목록표'}`)}<div class="actions"><button class="secondary" onclick="navigate('library','${view.mode}')">← 에피소드 폴더</button><button class="primary" onclick="view.idx=0;view.quiz=true;view.reveal=false;render()">${view.mode==='writing'?'영작 시작':'단어 쓰기 시험'}</button>${view.mode==='writing'?`<button class="secondary" onclick="exportReview('${view.ep}')">첨삭용 복사</button>`:''}</div><div class="panel"><div class="panelhead"><h3>Episode Progress.</h3><span>${d} / ${t}</span></div><div class="bar"><div class="fill" style="width:${t?d/t*100:0}%"></div></div></div>${view.quiz?quiz(p):view.mode==='vocab'?vocabList(p):writingList(p)}`};function writingList(p){return `<div class="sheet"><div class="sheethead"><span class="eyebrow">WRITING EXERCISES</span><span class="eyebrow">${p.items.length} ENTRIES</span></div>${p.items.map((x,i)=>{let answer=db.answers[x.id],f=db.feedback[x.id],status=f?(f.verdict==='correct'?'CORRECT':'REVISE'):(answer?.trim()?'SUBMITTED':'NOT STARTED');let opened=expandedWriting===x.id;return `<div class="writing-entry"><button class="writing-row" aria-expanded="${opened}" onclick="toggleWriting('${esc(x.id)}')"><span>${String(i+1).padStart(2,'0')}</span><span>${esc(x['한국어'])}</span><span class="status ${f?.verdict||''}">${status}</span><span class="arrow">${opened?'⌃':'⌄'}</span></button>${opened?`<div class="writing-detail"><div class="eyebrow">YOUR ANSWER</div><p>${answer?esc(answer):'아직 작성한 답안이 없어.'}</p>${f?`<div class="feedback-note"><div class="eyebrow">CHATGPT CORRECTION · ${f.verdict==='correct'?'CORRECT':'REVISE'}</div><p><b>${esc(f.correction||'')}</b></p><p>${esc(f.explanation||'')}</p>${f.tags?.length?`<p class="tagline">${f.tags.map(t=>`<span class="pill">${esc(t)}</span>`).join(' ')}</p>`:''}</div>`:answer?'<p class="sub">첨삭 대기 중 · Review에서 JSON 결과를 가져오면 여기에 표시돼.</p>':''}<div class="actions"><button class="secondary" onclick="openWriting(${i})">${answer?'답안 다시 보기 / 수정':'이 문제 풀기'}</button></div></div>`:''}</div>`}).join('')}</div>`};function toggleWriting(id){expandedWriting=expandedWriting===id?null:id;render()};function openWriting(i){view.idx=i;view.quiz=true;view.reveal=false;render()};function vocabList(p){return `<div class="sheet"><div class="sheethead"><span class="eyebrow">WORD REGISTER</span><span class="eyebrow">${esc(view.ep)}</span></div><div class="vocabrow head"><span>NO.</span><span>WORD</span><span>MEANING</span><span>STATUS</span></div>${p.items.map((x,i)=>`<div class="vocabrow"><span>${String(i+1).padStart(2,'0')}</span><span>${esc(isVerb(x)?verbForms(x).join(' · '):x['정답'])}<label class="review-mini"><input type="checkbox" ${db.reviewFlags[x.id]?'checked':''} onchange="markReview('${x.id}',this.checked)"> 복습</label></span><span>${esc(x['뜻'])}</span><span class="status">${db.vocabResults[x.id]?.attempts?db.vocabResults[x.id].correct?'LEARNED':'REVIEW':'NEW'}</span></div>`).join('')}</div>`};function quiz(p){let x=p.items[view.idx];if(!x)return '';let mode=view.mode,isW=mode==='writing',prev=isW?db.answers[x.id]||'':'';return `<div class="sheet"><div class="sheethead"><span class="eyebrow">${isW?'WRITING EXERCISE':'VOCABULARY TEST'}</span><span class="eyebrow">${view.idx+1} / ${p.items.length}</span></div><div style="margin-top:18px"><span class="pill">${esc(x['난이도']||'B1–B2')}</span> <span class="pill">${esc(x['문법']||x['품사']||'PRACTICE')}</span></div><div class="question">${esc(isW?x['한국어']:x['뜻'])}</div><label class="eyebrow" for="useranswer">YOUR ANSWER</label>${isW?`<textarea class="answer" id="useranswer" placeholder="Write your English sentence here...">${esc(prev)}</textarea>`:`${isVerb(x)?`<div class="verbfields"><label>BASE FORM · 기본형<input class="answer short" id="useranswer" autocomplete="off" spellcheck="false" placeholder="기본형"></label><label>PAST SIMPLE · 과거형<input class="answer short" id="pastanswer" autocomplete="off" spellcheck="false" placeholder="과거형"></label><label>PAST PARTICIPLE · 과거분사<input class="answer short" id="participleanswer" autocomplete="off" spellcheck="false" placeholder="과거분사"></label></div>`:`<input class="answer short" id="useranswer" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="영어 단어를 입력해" value="">`}`}<div class="actions"><button class="primary" onclick="submitAnswer()">${isW?'답안 저장':'채점하기'}</button><button class="secondary" onclick="view.reveal=!view.reveal;renderReveal()">${view.reveal?'정답 숨기기':'기준 답안 보기'}</button></div><div id="result">${view.reveal?revealHTML(x):''}</div>${!isW?`<label class="review-toggle"><input type="checkbox" ${db.reviewFlags[x.id]?'checked':''} onchange="markReview('${x.id}',this.checked)"> 다시 외울 단어로 표시</label>`:''}${isW&&db.feedback[x.id]?`<div class="feedback-note"><div class="eyebrow">SAVED CORRECTION · ${esc(db.feedback[x.id].verdict.toUpperCase())}</div><p><b>${esc(db.feedback[x.id].correction)}</b></p><p>${esc(db.feedback[x.id].explanation)}</p></div>`:''}<div class="actions"><button class="secondary" onclick="move(-1)" ${view.idx===0?'disabled':''}>← 이전</button><button class="secondary" onclick="move(1)" ${view.idx===p.items.length-1?'disabled':''}>다음 →</button><button class="secondary" onclick="view.quiz=false;render()">목록으로</button></div></div>`};function revealHTML(x){return `<div class="note"><b>MODEL ANSWER</b>\n${esc(view.mode==='writing'?x['기준 영어']:(isVerb(x)?verbForms(x).join(' · '):x['정답']))}${x['설명']?'\n\n'+esc(x['설명']):''}</div>`};function renderReveal(){let x=db.packs[view.mode][view.ep].items[view.idx];$('result').innerHTML=view.reveal?revealHTML(x):''};function move(d){view.idx+=d;view.reveal=false;render()};function submitAnswer(){let x=db.packs[view.mode][view.ep].items[view.idx],val=$('useranswer').value.trim();if(!val)return toast('답안을 먼저 입력해줘');if(view.mode==='writing'){let first=!db.answers[x.id];db.answers[x.id]=val;activity('writing');if(first)award('writing:'+x.id,10);toast('영작 답안을 저장했어. AI 첨삭은 별도야.')}else{let norm=v=>String(v||'').trim().toLocaleLowerCase();let parts=isVerb(x)?[val,$('pastanswer').value,$('participleanswer').value]:[val];let correct=isVerb(x)?parts.every((v,i)=>norm(v)===norm(verbForms(x)[i])):[x['정답'],...(x['허용 정답']||'').split('|')].some(v=>norm(v)===norm(val));let r=db.vocabResults[x.id]||{attempts:0,streak:0};r.attempts++;r.correct=correct;r.streak=correct?r.streak+1:0;r.last=dateKey();r.next=nextDate(!correct||db.reviewFlags[x.id]?1:[1,3,7,14,30][Math.min(r.streak-1,4)]);db.vocabResults[x.id]=r;activity('vocab');if(correct)award('vocab:'+x.id,isVerb(x)?10:5);view.reveal=true;renderReveal();toast(correct?'정답!':'오답 · 복습 목록에 추가했어.')}save();}
function nextDate(days){let d=new Date();d.setDate(d.getDate()+days);return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};function exportReview(ep){let p=db.packs.writing[ep];let rows=p.items.filter(x=>db.answers[x.id]?.trim()).map(x=>`ID: ${x.id}\n한국어: ${x['한국어']}\n내 답안: ${db.answers[x.id]}\n기준 답안: ${x['기준 영어']}\n문법: ${x['문법']||''}`).join('\n\n---\n\n');if(!rows)return toast('먼저 영작 답안을 제출해줘');let content=`다음 영작을 첨삭해줘. 의미·시제·어순·관계사·자연스러움을 검토하고 허용 가능한 대안도 인정해줘. 마지막에는 아래 형식의 JSON 배열을 코드블록으로 출력해줘. 각 항목은 {"id":"원래 ID","verdict":"correct|revise","tags":["tense"],"correction":"교정 문장","explanation":"한국어 설명"} 형식이야.\n\n${rows}`;copy(content)};async function copy(s){try{await navigator.clipboard.writeText(s);toast('클립보드에 복사했어')}catch{prompt('아래 내용을 복사해줘',s)}};function review(){let due=Object.entries(db.vocabResults).filter(([id,r])=>r.next<=dateKey()||db.reviewFlags[id]);let flagged=Object.keys(db.reviewFlags).filter(id=>db.reviewFlags[id]&&!db.vocabResults[id]);return `<div class="eyebrow">SPACED REPETITION</div><h1>Review Desk.</h1><p class="sub">틀린 단어와 복습 예정 단어를 확인해. 영작 첨삭 결과도 이곳에서 가져올 수 있어.</p><div class="stats"><div class="stat"><strong>${new Set([...due.map(([id])=>id),...flagged]).size}</strong><small>오늘 단어 복습</small></div><div class="stat"><strong>${Object.keys(db.feedback).length}</strong><small>영작 첨삭 기록</small></div><div class="stat"><strong>${Object.keys(db.answers).length}</strong><small>저장된 영작</small></div></div><div class="sheet"><h3>ChatGPT 첨삭 결과 가져오기</h3><p class="sub">ChatGPT가 반환한 JSON 배열만 붙여넣어. ID가 일치하는 영작에 기록돼.</p><textarea class="textarea-small" id="feedbackinput" placeholder='[{"id":"writing:S1_EP01:W001","verdict":"revise","tags":["tense"],"correction":"...","explanation":"..."}]'></textarea><div class="actions"><button class="primary" onclick="importFeedback()">첨삭 결과 반영</button></div><div class="sub">현재 버전은 첨삭을 기록하고 오답을 표시해. 영작 자동 재출제는 추후 확장할 예정이야. 첨삭 결과는 해당 에피소드의 Writing Exercises에서 확인해.</div></div>${due.length||flagged.length?`<div class="sheet"><h3>복습 예정 단어</h3><p class="sub">복습할 단어를 눌러 다시 시험 볼 수 있어.</p>${[...new Set([...due.map(([id])=>id),...flagged])].map(id=>`<div class="vocabrow" style="grid-template-columns:1fr 100px"><button class="secondary" onclick="reviewWord('${id}')">${esc(id)}</button><span>재시험 →</span></div>`).join('')}</div>`:''}`};function importFeedback(){try{let s=$('feedbackinput').value.trim().replace(/^```(?:json)?\s*/,'').replace(/\s*```$/,'');let data=JSON.parse(s);if(!Array.isArray(data))throw Error('JSON 배열이어야 해');let n=0;for(let item of data){if(!item.id||!['correct','revise'].includes(item.verdict))continue;if(!db.answers[item.id])continue;db.feedback[item.id]={verdict:item.verdict,tags:Array.isArray(item.tags)?item.tags:[],correction:item.correction||'',explanation:item.explanation||'',at:dateKey()};n++}save();toast(`${n}개 첨삭 결과 반영`);render()}catch(e){alert('첨삭 JSON 형식을 확인해줘: '+e.message)}};function records(){let dates=Object.entries(db.activity).sort((a,b)=>b[0].localeCompare(a[0]));let totalW=dates.reduce((s,[k,v])=>s+(v.writing||0),0),totalV=dates.reduce((s,[k,v])=>s+(v.vocab||0),0);return `<div class="eyebrow">STUDY RECORDS</div><h1>Learning Ledger.</h1><div class="stats"><div class="stat"><strong>${dates.length}</strong><small>학습한 날</small></div><div class="stat"><strong>${totalW}</strong><small>영작 제출 횟수</small></div><div class="stat"><strong>${totalV}</strong><small>단어 응시 횟수</small></div></div><div class="sheet"><h3>최근 학습 기록</h3>${dates.length?dates.slice(0,30).map(([d,v])=>`<div class="vocabrow" style="grid-template-columns:1fr 1fr 1fr"><span>${d}</span><span>영작 ${v.writing||0}</span><span>단어 ${v.vocab||0}</span></div>`).join(''):'<p class="sub">아직 학습 기록이 없어.</p>'}</div>`};function settings(){return `<div class="eyebrow">PERSONAL ARCHIVE</div><h1>Settings & Files.</h1><p class="sub">학습팩 MD는 GitHub에 업로드하지 않고 기기에서 직접 불러와. 브라우저 저장 데이터가 지워지면 기록도 사라질 수 있으니 백업을 활용해.</p><div class="sheet"><h3>학습 기록 백업</h3><div class="actions"><button class="primary" onclick="backup()">JSON 백업 다운로드</button><button class="secondary" onclick="$('restorefile').click()">백업 복원</button><input class="hidden" type="file" id="restorefile" accept=".json" onchange="restore(event)"></div><p class="sub">PC·아이폰 동기화는 아직 지원하지 않아. 백업은 수동으로 옮겨야 해.</p></div><div class="sheet"><h3>MD 파일 형식</h3><p class="sub">에피소드 ID는 영작과 단어 파일에서 동일하게 작성해.</p><div class="note"># Episode\n- episode: S1_EP01\n- title: First Meeting\n\n## W001\n- 한국어: 어제 당신을 봤어요.\n- 기준 영어: I saw you yesterday.\n- 난이도: B1\n- 문법: 과거시제\n- 설명: see의 과거형은 saw.</div><div class="note"># Vocabulary\n- episode: S1_EP01\n- title: First Meeting\n\n## V001\n- 뜻: 망설이다\n- 정답: hesitate\n- 허용 정답: hesitate\n- 품사: 동사\n- 난이도: B1</div><p class="sub">현재 파서는 위처럼 정해진 한 줄 메타데이터 형식을 읽어. 다중 행 설명이나 복잡한 Markdown 표는 지원하지 않아.</p></div><div class="sheet"><h3>개인정보와 한계</h3><p class="sub">로컬 저장은 현재 브라우저의 localStorage를 사용해. Supabase 로그인·동기화, AI 자동 첨삭, 영작 자동 재출제는 아직 구현되지 않았어. 단어 채점은 등록된 정답과 허용 정답의 철자 일치 방식이야. 공개된 GitHub Pages에서 사용하는 경우에도 불러온 MD 원본은 자동으로 GitHub에 올라가지 않아.</p></div>`};function backup(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='sawgin-study-backup-'+dateKey()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};async function restore(ev){let f=ev.target.files?.[0];if(!f)return;try{let v=JSON.parse(await f.text());if(!v.packs||!v.answers||!v.activity)throw Error('백업 형식이 달라');if(!confirm('현재 학습 기록을 백업 파일로 교체할까?'))return;db=v;save();render();toast('백업을 복원했어')}catch(e){alert('복원 실패: '+e.message)}};function setSort(v){db.settings['sort_'+view.mode]=v;save();render()}
function isVerb(x){return !!(x['기본형']||x['base']||x['과거형']||x['past']||x['과거분사']||x['participle'])}
function verbForms(x){return [x['기본형']||x['base']||x['정답'],x['과거형']||x['past']||'',x['과거분사']||x['participle']||'']}
function markReview(id,checked){db.reviewFlags[id]=checked;if(db.vocabResults[id]){db.vocabResults[id].next=checked?dateKey():db.vocabResults[id].next}save();toast(checked?'복습 목록에 표시했어':'수동 복습 표시를 해제했어')}
function reviewWord(id){for(let [ep,p] of Object.entries(db.packs.vocab)){let idx=p.items.findIndex(x=>x.id===id);if(idx>=0){view={page:'pack',mode:'vocab',ep,idx,quiz:true,reveal:false};render();scrollTo(0,0);return}}toast('원본 단어팩을 찾지 못했어')}
function award(key,points){if(db.xpAwards[key])return;db.xpAwards[key]=points;save()}
function totalXP(){let xp=Object.values(db.xpAwards).reduce((a,b)=>a+Number(b||0),0);for(let [mode,packs] of Object.entries(db.packs))for(let [ep,p] of Object.entries(packs)){let [done,total]=count(mode,ep);if(total&&done===total)xp+=50}return xp}
function levelInfo(){let xp=totalXP(),level=1,threshold=100;while(xp>=threshold&&level<100){level++;threshold+=level*100}let previous=threshold-level*100;return {xp,level,previous,threshold}}
function membership(){let a=levelInfo(),pct=Math.max(0,Math.min(100,100*(a.xp-a.previous)/(a.threshold-a.previous)));return `<section class="panel membership"><div class="panelhead"><h3>Library Membership.</h3><span class="pill">L${a.level} · ${a.level<3?'Reader':a.level<6?'Collector':'Archivist'}</span></div><div class="between"><span>${a.xp} XP</span><span>Next · ${a.threshold} XP</span></div><div class="bar"><div class="fill" style="width:${pct}%"></div></div><p class="sub">문제 첫 정답·제출과 에피소드 완료로 성장해. 복습은 언제든 가능해.</p></section>`}
function achievementPanel(){let checks=[{key:'first-writing',title:'First Page',ok:Object.keys(db.answers).length>=1},{key:'first-vocab',title:'First Word',ok:Object.values(db.vocabResults).some(r=>r.attempts>0)},{key:'five-words',title:'Word Collector',ok:Object.values(db.vocabResults).filter(r=>r.correct).length>=5},{key:'first-feedback',title:'The Editor',ok:Object.keys(db.feedback).length>=1},{key:'first-episode',title:'Archivist',ok:Object.entries(db.packs).some(([mode,packs])=>Object.keys(packs).some(ep=>{let [d,t]=count(mode,ep);return t&&d===t}))}];return `<section class="panel achievements"><div class="panelhead"><h3>Achievement Cabinet.</h3><span class="eyebrow">${checks.filter(x=>x.ok).length} / ${checks.length} UNLOCKED</span></div><div class="badge-grid">${checks.map(x=>`<div class="achievement ${x.ok?'unlocked':'locked'}"><span class="stamp">${x.ok?'✦':'◇'}</span><b>${x.title}</b><small>${x.ok?'STAMPED':'LOCKED'}</small></div>`).join('')}</div></section>`}
function render(){let app=$('app');app.innerHTML=({home,library,pack,review,records,settings}[view.page]||home)();document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===view.page))};document.querySelectorAll('[data-nav]').forEach(b=>b.addEventListener('click',()=>navigate(b.dataset.nav)));render();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./service-worker.js').catch(()=>{});
</script></body></html>
